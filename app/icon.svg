<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#1A4731"/>

  <!-- Subtle inner border -->
  <rect x="3" y="3" width="94" height="94" rx="19" stroke="#52B788" stroke-width="1.5" opacity="0.4"/>

  <!-- K — cream white -->
  <line x1="22" y1="22" x2="22" y2="78" stroke="#FAFAF6" stroke-width="8" stroke-linecap="round"/>
  <line x1="22" y1="50" x2="44" y2="22" stroke="#FAFAF6" stroke-width="8" stroke-linecap="round"/>
  <line x1="22" y1="50" x2="44" y2="78" stroke="#FAFAF6" stroke-width="8" stroke-linecap="round"/>

  <!-- G — sage green -->
  <!-- Arc: open circle on left side -->
  <path d="M78 30 A22 22 0 1 0 78 70" stroke="#52B788" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Horizontal bar of G -->
  <line x1="78" y1="50" x2="62" y2="50" stroke="#52B788" stroke-width="8" stroke-linecap="round"/>

  <!-- Small tea leaf dot between K and G -->
  <circle cx="50" cy="50" r="3.5" fill="#52B788" opacity="0.6"/>
</svg>
